<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Soporte de Tactical Trading: elige tu caso y escríbenos por WhatsApp.">
  <title>Soporte, Tactical Trading</title>

  <link rel="icon" href="/assets/logo-isotipo.webp" type="image/webp">
  <link rel="preload" href="/assets/fonts/raleway.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/links.css">
</head>

<!-- pagina-links trae el layout base (halo, envoltorio, hero, footer);
     pagina-soporte agrega la lista de categorías, montada por soporte.js. -->
<body class="pagina-links pagina-soporte">

  <div class="links-fondo" aria-hidden="true"></div>

  <div class="links-envoltorio">

    <header class="links-header">
      <img class="header__logo" src="/assets/logo-lockup.webp" alt="Tactical Trading" width="42" height="40">
    </header>

    <main class="links-main">
      <section class="links-hero">
        <span class="badge">Soporte</span>
        <h1 class="links-titulo">Escríbenos según tu <em>caso</em></h1>
        <p class="links-subtitulo">Elige la categoría que mejor describe lo que necesitas y te atendemos por WhatsApp.</p>
      </section>

      <hr class="divisor divisor--brillo">

      <noscript>
        <p class="sin-js">
          Necesitas activar JavaScript para ver los contactos.
          Si no puedes, escríbenos por WhatsApp desde
          <a href="https://www.ttrading.co">ttrading.co</a> y te ayudamos.
        </p>
      </noscript>

      <div class="soporte-lista" id="soporte" aria-label="Categorías de soporte"></div>
    </main>

    <footer class="links-footer">
      <p class="footer__titulo">Reconocimientos</p>
      <div class="reconocimientos" id="reconocimientos"></div>
      <p class="footer__meta">
        <a href="https://www.ttrading.co" target="_blank" rel="noopener noreferrer">ttrading.co</a>
        · <span>Tactical Assets S.A.S.</span>
      </p>
    </footer>

  </div>

  <script src="/config.js"></script>
  <script src="/shared.js"></script>
  <script src="/soporte.js"></script>
</body>
</html>
