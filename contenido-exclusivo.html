<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Contenido exclusivo de Tactical Trading: la operación en vivo por Zoom y el grupo de WhatsApp.">
  <title>Contenido exclusivo, Tactical Trading</title>

  <link rel="icon" href="/assets/logo-isotipo.webp" type="image/webp">
  <link rel="preload" href="/assets/fonts/raleway.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/links.css">
</head>

<!-- Misma base que /estrategia-tactical (pagina-links + pagina-estrategia);
     pagina-contenido marca esta variante. Solo dos accesos, montados por
     contenido-exclusivo.js sobre #botones. -->
<body class="pagina-links pagina-estrategia pagina-contenido">

  <div class="links-fondo" aria-hidden="true"></div>

  <div class="links-envoltorio">

    <header class="links-header">
      <img class="header__logo" src="/assets/logo-lockup.webp" alt="Tactical Trading" width="42" height="40">
    </header>

    <main class="links-main">
      <section class="links-hero">
        <span class="badge">Contenido exclusivo</span>
        <h1 class="links-titulo">Contenido <em>exclusivo</em></h1>
        <p class="links-subtitulo">Entra a la operación en vivo por Zoom y al grupo de WhatsApp.</p>
      </section>

      <hr class="divisor divisor--brillo">

      <noscript>
        <p class="sin-js">
          Necesitas activar JavaScript para ver los accesos.
          Si no puedes, escríbenos por WhatsApp desde
          <a href="https://www.ttrading.co">ttrading.co</a> y te los pasamos.
        </p>
      </noscript>

      <div class="links-grid" id="botones" aria-label="Accesos al contenido exclusivo"></div>
    </main>

    <footer class="links-footer">
      <p class="footer__titulo">Reconocimientos</p>
      <div class="reconocimientos" id="reconocimientos"></div>
      <p class="footer__meta">
        <a href="https://www.ttrading.co" target="_blank" rel="noopener noreferrer">ttrading.co</a>
        · <span>Tactical Assets S.A.S.</span>
      </p>
    </footer>

  </div>

  <script src="/config.js"></script>
  <script src="/shared.js"></script>
  <script src="/contenido-exclusivo.js"></script>
</body>
</html>
