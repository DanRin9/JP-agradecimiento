<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="El mes de acompañamiento de De Cero a Tactical Investor: operación en vivo, recuento semanal, office hours y más, todo en un solo lugar.">
  <title>Mes de Acompañamiento, De Cero a Tactical Investor</title>

  <link rel="icon" href="/assets/logo-isotipo.webp" type="image/webp">
  <link rel="preload" href="/assets/fonts/raleway.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/links.css">
</head>

<!-- pagina-links trae el layout base (halo, envoltorio, header, footer);
     pagina-acompanamiento solo ajusta el ancho. Todo el contenido (hero
     incluido, porque necesita la fecha de vigencia calculada) lo monta
     acompanamiento.js sobre #vista: es demasiado heterogéneo (seis bloques de
     naturaleza distinta) para hardcodearlo en el marcado. -->
<body class="pagina-links pagina-acompanamiento">

  <div class="links-fondo" aria-hidden="true"></div>

  <div class="links-envoltorio">

    <header class="links-header">
      <img class="header__logo" src="/assets/logo-lockup.webp" alt="Tactical Trading" width="42" height="40">
    </header>

    <noscript>
      <p class="sin-js">
        Necesitás activar JavaScript para ver el mes de acompañamiento.
        Si no podés, escribinos por WhatsApp desde
        <a href="https://www.ttrading.co">ttrading.co</a> y te pasamos la información.
      </p>
    </noscript>

    <main class="links-main" id="vista"></main>

    <footer class="links-footer">
      <p class="footer__titulo">Reconocimientos</p>
      <div class="reconocimientos" id="reconocimientos"></div>
      <p class="footer__meta">
        <a href="https://www.ttrading.co" target="_blank" rel="noopener noreferrer">ttrading.co</a>
        · <span>Tactical Assets S.A.S.</span>
      </p>
    </footer>

  </div>

  <script src="/config.js"></script>
  <script src="/shared.js"></script>
  <script src="/acompanamiento.js"></script>
</body>
</html>
