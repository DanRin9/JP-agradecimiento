<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Grabaciones del Recuento de Estrategia Semanal con Juan Pablo Vieira.">
  <title>Recuentos semanales, Tactical Trading</title>

  <link rel="icon" href="/assets/logo-isotipo.webp" type="image/webp">
  <link rel="preload" href="/assets/fonts/raleway.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/links.css">
</head>

<!-- pagina-links trae el layout base (halo, envoltorio, header, footer);
     pagina-recuentos agrega el reproductor + la grilla de recuentos, todo
     montado por recuentos.js sobre #vista. -->
<body class="pagina-links pagina-recuentos">

  <div class="links-fondo" aria-hidden="true"></div>

  <div class="links-envoltorio">

    <header class="links-header">
      <img class="header__logo" src="/assets/logo-lockup.webp" alt="Tactical Trading" width="42" height="40">
    </header>

    <noscript>
      <p class="sin-js">
        Necesitas activar JavaScript para ver las grabaciones.
        Si no puedes, escríbenos por WhatsApp desde
        <a href="https://www.ttrading.co">ttrading.co</a> y te las pasamos.
      </p>
    </noscript>

    <main class="links-main" id="vista"></main>

    <footer class="links-footer">
      <p class="footer__titulo">Reconocimientos</p>
      <div class="reconocimientos" id="reconocimientos"></div>
      <p class="footer__meta">
        <a href="https://www.ttrading.co" target="_blank" rel="noopener noreferrer">ttrading.co</a>
        · <span>Tactical Assets S.A.S.</span>
      </p>
    </footer>

  </div>

  <script src="/config.js"></script>
  <script src="/shared.js"></script>
  <script src="/recuentos.js"></script>
</body>
</html>
